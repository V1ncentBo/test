<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>全局运行态势 · 智能监控平台</title>
<style>
:root{--bg:#f2f6fb;--panel:#fff;--ink:#10233f;--muted:#718198;--line:#dce6f0;--blue:#246bfd;--cyan:#159bb8;--green:#149a78;--red:#df4b4b;--amber:#dc8b18;--violet:#7758d9;--shadow:0 8px 28px rgba(30,66,110,.055)}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;color:var(--ink);background:var(--bg)}button{font:inherit}button:focus-visible,a:focus-visible{outline:3px solid rgba(36,107,253,.25);outline-offset:2px}
#viewport{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;background-color:var(--bg);background-image:linear-gradient(rgba(63,110,164,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(63,110,164,.035) 1px,transparent 1px);background-size:32px 32px}
#stage{position:relative;width:1600px;height:900px;flex:0 0 auto;transform-origin:center center;padding:22px 26px 16px;display:flex;flex-direction:column;gap:14px;background:radial-gradient(circle at 48% -20%,rgba(128,184,255,.17),transparent 42%)}
.header{height:62px;flex:0 0 62px;display:flex;align-items:center;justify-content:space-between;padding:0 4px}
.brand{display:flex;align-items:center;gap:14px}.brand-mark{width:42px;height:42px;border-radius:12px;background:#e5efff;color:var(--blue);display:grid;place-items:center;border:1px solid #d1e1fa}.brand-mark svg{width:25px;height:25px}.brand h1{margin:0;font-size:25px;line-height:1.15;letter-spacing:.04em;font-weight:650}.brand p{margin:6px 0 0;font-size:10px;letter-spacing:.18em;color:#7890ad}
.header-right{display:flex;align-items:center;gap:12px}.live-pill{height:34px;padding:0 13px;display:flex;align-items:center;gap:8px;border-radius:17px;background:#e8f7f1;color:#0e7b5f;font-size:12px;border:1px solid #cdebe0}.live-pill.bad{background:#fff0ef;color:#b53d3d;border-color:#f3d0cd}.dot{width:7px;height:7px;border-radius:50%;background:currentColor}.live-pill:not(.bad) .dot{box-shadow:0 0 0 4px rgba(20,154,120,.1)}
.clock{text-align:right;min-width:152px}.clock-time{font-family:Bahnschrift,Consolas,monospace;font-size:23px;font-weight:600;letter-spacing:.05em;line-height:1}.clock-date{font-size:11px;color:var(--muted);margin-top:5px}.head-btn{border:1px solid var(--line);background:#fff;color:#49627f;height:34px;padding:0 12px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:6px;font-size:12px}.head-btn:hover{border-color:#aac7ee;color:var(--blue)}.head-btn svg{width:15px;height:15px}
.kpis{height:112px;flex:0 0 112px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}.kpi{position:relative;overflow:hidden;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:16px 18px;box-shadow:var(--shadow)}.kpi:before{content:"";position:absolute;left:0;top:18px;bottom:18px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}.kpi-head{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:12px}.kpi-icon{width:26px;height:26px;border-radius:8px;background:color-mix(in srgb,var(--accent) 10%,white);color:var(--accent);display:grid;place-items:center}.kpi-icon svg{width:15px;height:15px}.kpi-main{display:flex;align-items:baseline;gap:7px;margin-top:8px}.kpi-value{font-family:Bahnschrift,"DIN Alternate",Consolas,monospace;font-size:35px;line-height:1;font-weight:600;letter-spacing:-.02em}.kpi-unit{font-size:13px;color:var(--muted)}.kpi-sub{font-size:10px;color:#8391a5;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid{flex:1;min-height:0;display:grid;grid-template-columns:258px minmax(0,1fr) 342px;grid-template-rows:minmax(0,1fr) 210px;gap:14px}.panel{min-width:0;min-height:0;background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);overflow:hidden}.panel-head{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid #edf2f7}.panel-title{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600}.panel-title:before{content:"";width:3px;height:15px;border-radius:2px;background:var(--blue)}.panel-note{font-size:10px;color:var(--muted)}.panel-body{padding:14px 16px}
.resource{grid-column:1;grid-row:1}.resource .panel-body{height:calc(100% - 48px);padding:12px 14px;display:flex;flex-direction:column}.online-ring{position:relative;width:116px;height:116px;margin:4px auto 8px;flex:0 0 auto}.online-ring svg{width:100%;height:100%;transform:rotate(-90deg)}.ring-bg{fill:none;stroke:#edf2f7;stroke-width:9}.ring-val{fill:none;stroke:var(--green);stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset .5s}.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}.ring-num{font-family:Bahnschrift,Consolas,monospace;font-size:26px;font-weight:600}.ring-label{font-size:11px;color:var(--muted);margin-top:3px}.resource-rows{display:flex;flex-direction:column;gap:12px}.resource-row-top{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin-bottom:6px}.resource-row-top span:last-child{font-family:Bahnschrift,Consolas,monospace;font-size:16px;font-weight:600}.bar{height:6px;background:#edf2f7;border-radius:4px;overflow:hidden}.bar>i{display:block;height:100%;border-radius:4px;background:var(--bar-color);transition:width .5s}.resource-foot{margin-top:auto;padding-top:10px;border-top:1px solid #edf2f7;display:grid;grid-template-columns:1fr 1fr;gap:8px}.mini-stat{padding:8px 9px;border-radius:8px;background:#f6f9fc}.mini-stat b{display:block;font-family:Bahnschrift,Consolas,monospace;font-size:18px}.mini-stat span{font-size:10px;color:var(--muted);white-space:nowrap}
.trend{grid-column:2;grid-row:1;position:relative}.trend .panel-head{padding-right:14px}.legend{display:flex;align-items:center;gap:13px;font-size:10px;color:var(--muted)}.legend button{border:0;background:transparent;padding:4px 0;display:flex;align-items:center;gap:5px;color:inherit;cursor:pointer;font-size:11px}.legend button.off{opacity:.35}.legend i{width:15px;height:3px;border-radius:2px;background:var(--c)}.trend-body{height:calc(100% - 48px);padding:8px 14px 10px;display:flex;flex-direction:column}.trend-summary{display:flex;gap:24px;padding:2px 8px 4px}.trend-stat{font-size:10px;color:var(--muted)}.trend-stat b{font-family:Bahnschrift,Consolas,monospace;font-size:15px;color:var(--ink);margin-left:5px}.chart-wrap{flex:1;min-height:0;position:relative}.chart-wrap svg{width:100%;height:100%;display:block}.chart-grid{stroke:#e8eef5;stroke-width:1}.chart-axis{fill:#8b9aae;font-size:10px;font-family:"Microsoft YaHei",sans-serif}.chart-line{fill:none;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}.chart-area{opacity:.08}.empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#8a99ab;font-size:12px;gap:8px}.empty:before{content:"";width:34px;height:34px;border-radius:50%;background:#edf3f8;border:1px dashed #bdccdb}
.alerts{grid-column:3;grid-row:1}.alert-count{padding:3px 8px;border-radius:10px;background:#fff0ef;color:#c54343;font-size:11px}.alerts-body{height:calc(100% - 48px);padding:10px 12px;display:flex;flex-direction:column}.alert-list{display:flex;flex-direction:column;gap:8px;flex:1;min-height:0}.alert-item{position:relative;flex:1 1 auto;min-height:96px;padding:8px 10px 7px 13px;background:#f8fafc;border:1px solid #edf1f5;border-radius:9px;cursor:pointer;overflow:visible}.alert-item:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--sev)}.alert-top{display:flex;align-items:center;justify-content:space-between;gap:8px}.alert-name{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.alert-time{font-family:Consolas,monospace;color:#93a0b0;font-size:10px;flex:0 0 auto}.alert-msg{font-size:11px;line-height:1.4;color:#5f7187;margin-top:4px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.alert-meta{font-size:9px;line-height:1.35;color:#96a3b2;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pager{display:flex;align-items:center;justify-content:center;gap:5px;padding-top:8px}.pager i{width:5px;height:5px;border-radius:50%;background:#d3dde7}.pager i.on{width:15px;border-radius:4px;background:var(--blue)}
.health{grid-column:1/3;grid-row:2}.health .panel-head{height:43px}.health .panel-body{height:calc(100% - 43px);padding:10px 14px}.health-legend{display:flex;gap:12px;font-size:10px;color:var(--muted)}.health-legend span{display:flex;align-items:center;gap:4px}.health-legend i{width:6px;height:6px;border-radius:50%;background:var(--c)}.machine-grid{height:100%;display:grid;grid-template-columns:repeat(10,minmax(0,1fr));grid-auto-rows:minmax(32px,1fr);gap:7px}.machine{position:relative;min-width:0;border:1px solid #e3eaf1;border-radius:7px;background:#f8fafc;padding:6px 8px;display:flex;flex-direction:column;justify-content:center;cursor:pointer;overflow:hidden;transition:transform .15s,border-color .15s}.machine:hover{transform:translateY(-2px);border-color:var(--blue);z-index:2}.machine-top{display:flex;align-items:center;gap:5px}.machine-dot{width:6px;height:6px;border-radius:50%;background:var(--hc);flex:0 0 auto}.machine-name{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.machine-metric{font-family:Consolas,monospace;font-size:9px;color:#8090a3;margin-top:3px;padding-left:11px}.machine.offline{background:#fff5f4;border-color:#f3d8d5}.machine.warning,.machine.critical{background:#fffaf0;border-color:#f0dfbc}.machine.maintenance{background:#f4f1ff}.machine.disabled{opacity:.55}
.capacity{grid-column:3;grid-row:2}.capacity .panel-head{height:43px}.capacity .panel-body{height:calc(100% - 43px);padding:9px 13px}.cap-list{height:100%;display:flex;flex-direction:column;gap:7px}.cap-item{flex:1;min-height:0;padding:7px 9px;border-radius:8px;background:#f8fafc;border:1px solid #edf1f5;cursor:pointer}.cap-top{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:11px}.cap-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cap-days{font-size:10px;color:var(--amber);flex:0 0 auto}.cap-info{display:flex;align-items:center;gap:8px;margin-top:6px}.cap-info .bar{flex:1;height:5px}.cap-pct{font-family:Consolas,monospace;font-size:10px;color:#65788e;min-width:38px;text-align:right}
.footer{height:22px;flex:0 0 22px;display:flex;align-items:center;justify-content:space-between;color:#8191a5;font-size:10px;padding:0 4px}.footer-left,.footer-right{display:flex;align-items:center;gap:16px}.footer b{font-weight:500;color:#5e7188}.footer-link{color:#52749c;text-decoration:none;cursor:pointer}.footer-link:hover{color:var(--blue)}
.tooltip{position:absolute;z-index:20;width:220px;padding:12px 13px;border-radius:10px;background:#10233f;color:#fff;box-shadow:0 12px 30px rgba(16,35,63,.2);pointer-events:none;display:none}.tooltip.show{display:block}.tooltip h3{font-size:13px;margin:0 0 7px}.tooltip p{display:flex;justify-content:space-between;margin:4px 0;font-size:11px;color:#c7d4e5}.tooltip p b{color:#fff;font-family:Consolas,monospace;font-weight:500}.tooltip small{display:block;margin-top:8px;color:#8fa9c7;font-size:9px}
.flash{animation:flash .45s ease}@keyframes flash{50%{color:var(--blue)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="viewport">
<div id="stage">
  <header class="header">
    <div class="brand">
      <div class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4M7 12l3-3 3 2 4-4"/></svg></div>
      <div><h1>全局运行态势</h1><p>INTELLIGENT MONITORING CENTER</p></div>
    </div>
    <div class="header-right">
      <div class="live-pill" id="livePill"><span class="dot"></span><span id="liveText">正在连接数据</span></div>
      <div class="clock"><div class="clock-time" id="clockTime">--:--:--</div><div class="clock-date" id="clockDate">----年--月--日</div></div>
      <button class="head-btn" id="refreshBtn" title="立即刷新（R）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 6v5h-5M4 18v-5h5"/><path d="M6.1 8a7 7 0 0111.7-1L20 11M4 13l2.2 4A7 7 0 0018 16"/></svg>刷新</button>
      <button class="head-btn" id="fullBtn" title="全屏（F）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg>全屏</button>
    </div>
  </header>
  <section class="kpis" id="kpis"></section>
  <main class="grid">
    <section class="panel resource"><div class="panel-head"><div class="panel-title">资源水位</div><span class="panel-note">全局实时均值</span></div><div class="panel-body" id="resourceBody"></div></section>
    <section class="panel trend"><div class="panel-head"><div class="panel-title">全局资源趋势</div><div class="legend" id="legend"></div></div><div class="trend-body" id="trendBody"></div></section>
    <section class="panel alerts"><div class="panel-head"><div class="panel-title">实时告警</div><span class="alert-count" id="alertCount">0 条未处理</span></div><div class="alerts-body" id="alertsBody"></div></section>
    <section class="panel health"><div class="panel-head"><div class="panel-title">设备健康矩阵</div><div class="health-legend" id="healthLegend"></div></div><div class="panel-body"><div class="machine-grid" id="machineGrid"></div></div></section>
    <section class="panel capacity"><div class="panel-head"><div class="panel-title">容量风险</div><span class="panel-note" id="capNote">按剩余天数排序</span></div><div class="panel-body" id="capacityBody"></div></section>
  </main>
  <footer class="footer"><div class="footer-left"><span><b>公开只读</b> · 不展示登录凭据与完整 IP</span><span id="updateText">等待首次数据</span></div><div class="footer-right"><span>15 秒自动刷新</span><a class="footer-link" href="/" target="_blank">进入管理后台 ↗</a></div></footer>
  <div class="tooltip" id="tooltip"></div>
</div>
</div>
<script>
(function(){
'use strict';
var API='/api/metrics/public/screen';
var DATA=null,LAST_OK='',FAILS=0,LOADING=false,ALERT_PAGE=0,ALERT_PAGES=1;
var visible={cpu:true,memory:true,disk:true};
var COLORS={cpu:'#246bfd',memory:'#149a78',disk:'#dc8b18'};
var NAMES={cpu:'CPU',memory:'内存',disk:'磁盘'};
var ICONS={
  total:'<rect x="4" y="4" width="16" height="13" rx="2"/><path d="M8 21h8M12 17v4"/>',
  online:'<path d="M20 6L9 17l-5-5"/>',offline:'<path d="M18 6L6 18M6 6l12 12"/>',
  alert:'<path d="M12 3l10 18H2L12 3z"/><path d="M12 9v5M12 18h.01"/>',
  cpu:'<rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 1v3M15 1v3M9 20v3M15 20v3M1 9h3M1 15h3M20 9h3M20 15h3"/>',
  sla:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'
};
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function num(v,d){var n=Number(v);return isFinite(n)?n.toFixed(d==null?1:d):'--'}
function svg(path){return'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'+path+'</svg>'}
function fit(){var s=Math.min(window.innerWidth/1600,window.innerHeight/900);document.getElementById('stage').style.transform='scale('+s+')'}
function clock(){var d=new Date(),p=function(n){return String(n).padStart(2,'0')};document.getElementById('clockTime').textContent=p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());document.getElementById('clockDate').textContent=d.getFullYear()+'年'+p(d.getMonth()+1)+'月'+p(d.getDate())+'日 · '+['周日','周一','周二','周三','周四','周五','周六'][d.getDay()]}
function kpi(label,value,unit,sub,color,icon){return'<article class="kpi" style="--accent:'+color+'"><div class="kpi-head"><span>'+label+'</span><i class="kpi-icon">'+svg(ICONS[icon])+'</i></div><div class="kpi-main"><span class="kpi-value">'+value+'</span><span class="kpi-unit">'+unit+'</span></div><div class="kpi-sub">'+sub+'</div></article>'}
function renderKpis(s){
  var rate=s.total_machines?(s.online_count/s.total_machines*100):0;
  document.getElementById('kpis').innerHTML=
    kpi('设备总数',s.total_machines||0,'台',(s.physical_count||0)+' 台物理机 · '+(s.vm_count||0)+' 台虚拟机','#246bfd','total')+
    kpi('在线设备',s.online_count||0,'台','在线率 '+num(rate,1)+'%','#149a78','online')+
    kpi('离线设备',s.offline_count||0,'台','需检查网络与采集状态','#df4b4b','offline')+
    kpi('今日告警',s.today_alerts||0,'条',(s.unresolved_alerts||0)+' 条尚未处理','#dc8b18','alert')+
    kpi('平均 CPU',num(s.avg_cpu,1),'%','内存 '+num(s.avg_memory,1)+'% · 磁盘 '+num(s.avg_disk,1)+'%','#7758d9','cpu')+
    kpi('7 日 SLA',num(s.avg_sla,2),'%','按一分钟有效采集点计算','#159bb8','sla');
}
function renderResource(s){
  var total=s.total_machines||0,rate=total?(s.online_count||0)/total*100:0,c=2*Math.PI*52,off=c*(1-Math.min(100,Math.max(0,rate))/100);
  var rows=[['CPU 使用率','avg_cpu','#246bfd'],['内存使用率','avg_memory','#149a78'],['磁盘使用率','avg_disk','#dc8b18']].map(function(r){var v=Number(s[r[1]])||0;return'<div><div class="resource-row-top"><span>'+r[0]+'</span><span>'+num(v,1)+'%</span></div><div class="bar" style="--bar-color:'+r[2]+'"><i style="width:'+Math.min(100,Math.max(0,v))+'%"></i></div></div>'}).join('');
  document.getElementById('resourceBody').innerHTML='<div class="online-ring"><svg viewBox="0 0 120 120"><circle class="ring-bg" cx="60" cy="60" r="52"/><circle class="ring-val" cx="60" cy="60" r="52" stroke-dasharray="'+c+'" stroke-dashoffset="'+off+'"/></svg><div class="ring-center"><span class="ring-num">'+num(rate,1)+'%</span><span class="ring-label">设备在线率</span></div></div><div class="resource-rows">'+rows+'</div><div class="resource-foot"><div class="mini-stat"><b>'+(s.monitored_count||0)+'</b><span>监控中设备</span></div><div class="mini-stat"><b>'+(s.alert_machines||0)+'</b><span>今日告警设备</span></div></div>';
}
function pointsFor(series,w,h,left,top,bottom){var pts=series||[],max=100,min=0,step=w/Math.max(1,pts.length-1);return pts.map(function(p,i){var v=Math.max(min,Math.min(max,Number(p.value)||0));return{x:left+i*step,y:top+(max-v)/max*(h-top-bottom),v:v,time:p.time}})}
function pathOf(pts){return pts.map(function(p,i){return(i?'L':'M')+p.x.toFixed(1)+' '+p.y.toFixed(1)}).join(' ')}
function lineChart(series){
  var all=(series.cpu||[]).concat(series.memory||[],series.disk||[]);if(!all.length)return'<div class="empty">暂无近 24 小时趋势数据</div>';
  var W=820,H=280,L=43,R=12,T=16,B=30,cw=W-L-R,html='<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img" aria-label="近24小时全局资源趋势">';
  [0,25,50,75,100].forEach(function(v){var y=T+(100-v)/100*(H-T-B);html+='<line class="chart-grid" x1="'+L+'" y1="'+y+'" x2="'+(W-R)+'" y2="'+y+'"/><text class="chart-axis" x="4" y="'+(y+3)+'">'+v+'%</text>'});
  var base=(series.cpu&&series.cpu.length?series.cpu:(series.memory||series.disk))||[];
  [0,Math.floor(base.length/4),Math.floor(base.length/2),Math.floor(base.length*3/4),base.length-1].forEach(function(idx,i,a){if(!base[idx]||a.indexOf(idx)!==i)return;var x=L+idx*cw/Math.max(1,base.length-1),d=new Date(base[idx].time),label=isNaN(d)?'':String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');html+='<text class="chart-axis" text-anchor="middle" x="'+x+'" y="'+(H-7)+'">'+label+'</text>'});
  ['cpu','memory','disk'].forEach(function(k){if(!visible[k]||!(series[k]||[]).length)return;var pts=pointsFor(series[k],cw,H,L,T,B),d=pathOf(pts);if(k==='cpu'&&pts.length){var area=d+' L'+pts[pts.length-1].x.toFixed(1)+' '+(H-B)+' L'+pts[0].x.toFixed(1)+' '+(H-B)+' Z';html+='<path class="chart-area" d="'+area+'" fill="'+COLORS[k]+'"/>'}html+='<path class="chart-line" d="'+d+'" stroke="'+COLORS[k]+'"/>';if(pts.length){var p=pts[pts.length-1];html+='<circle cx="'+p.x+'" cy="'+p.y+'" r="3.5" fill="#fff" stroke="'+COLORS[k]+'" stroke-width="2"/>'}});
  return html+'</svg>';
}
function renderLegend(){document.getElementById('legend').innerHTML=['cpu','memory','disk'].map(function(k){return'<button data-metric="'+k+'" class="'+(visible[k]?'':'off')+'" style="--c:'+COLORS[k]+'"><i></i>'+NAMES[k]+'</button>'}).join('');var bs=document.querySelectorAll('#legend button');Array.prototype.forEach.call(bs,function(b){b.onclick=function(){visible[b.dataset.metric]=!visible[b.dataset.metric];renderLegend();renderTrend(DATA.trend||{})}})}
function renderTrend(trend){var raw=trend.series||{},series={cpu:raw.cpu||raw.cpu_percent||[],memory:raw.memory||raw.memory_percent||[],disk:raw.disk||raw.disk_percent||[]};var stats=['cpu','memory','disk'].map(function(k){var p=series[k]||[],last=p.length?p[p.length-1].value:null;return'<span class="trend-stat">'+NAMES[k]+' 当前<b>'+(last==null?'--':num(last,1)+'%')+'</b></span>'}).join('');document.getElementById('trendBody').innerHTML='<div class="trend-summary">'+stats+'<span class="trend-stat" style="margin-left:auto">近 24 小时 · 15 分钟聚合</span></div><div class="chart-wrap">'+lineChart(series)+'</div>'}
function severity(m){return m.health||'normal'}
function renderHealth(machines){
  var counts={normal:0,warning:0,offline:0,maintenance:0};machines.forEach(function(m){var h=severity(m);if(h==='critical')counts.warning++;else if(counts[h]!=null)counts[h]++;else if(h==='disabled')counts.offline++});
  document.getElementById('healthLegend').innerHTML=[['normal','正常','#149a78'],['warning','风险','#dc8b18'],['offline','离线','#df4b4b'],['maintenance','维护','#7758d9']].map(function(x){return'<span style="--c:'+x[2]+'"><i></i>'+x[1]+' '+counts[x[0]]+'</span>'}).join('');
  var sorted=machines.slice().sort(function(a,b){var rank={offline:0,critical:1,warning:2,maintenance:3,disabled:4,normal:5};return(rank[severity(a)]||9)-(rank[severity(b)]||9)||a.id-b.id});
  document.getElementById('machineGrid').innerHTML=sorted.map(function(m){var h=severity(m),color={normal:'#149a78',warning:'#dc8b18',critical:'#df4b4b',offline:'#df4b4b',maintenance:'#7758d9',disabled:'#94a3b8'}[h];var v=m.metrics||{},metric=m.online_status==='online'?'CPU '+num(v.cpu,0)+'% · 内存 '+num(v.memory,0)+'%':'最后状态 · '+esc(m.online_status||'--');return'<div class="machine '+h+'" data-id="'+m.id+'" style="--hc:'+color+'"><div class="machine-top"><i class="machine-dot"></i><span class="machine-name">'+esc(m.name)+'</span></div><div class="machine-metric">'+metric+'</div></div>'}).join('');
  bindMachineEvents(machines);
}
function bindMachineEvents(machines){var map={};machines.forEach(function(m){map[m.id]=m});var tip=document.getElementById('tooltip');Array.prototype.forEach.call(document.querySelectorAll('.machine'),function(el){var m=map[el.dataset.id];el.onmouseenter=function(){var v=m.metrics||{};tip.innerHTML='<h3>'+esc(m.name)+'</h3><p><span>地址</span><b>'+esc(m.ip)+'</b></p><p><span>CPU</span><b>'+num(v.cpu,1)+'%</b></p><p><span>内存</span><b>'+num(v.memory,1)+'%</b></p><p><span>磁盘</span><b>'+num(v.disk,1)+'%</b></p><small>点击进入设备详情（需后台权限）</small>';tip.classList.add('show');moveTip(el)};el.onmousemove=function(){moveTip(el)};el.onmouseleave=function(){tip.classList.remove('show')};el.onclick=function(){window.open('/monitor/'+m.id,'_blank')}})}
function moveTip(el){var stage=document.getElementById('stage'),tip=document.getElementById('tooltip'),r=el.getBoundingClientRect(),sr=stage.getBoundingClientRect(),scale=sr.width/1600;var x=(r.left-sr.left)/scale+8,y=(r.bottom-sr.top)/scale+8;if(x+230>1600)x-=230;if(y+180>900)y=(r.top-sr.top)/scale-172;tip.style.left=x+'px';tip.style.top=y+'px'}
function timeShort(v){var p=String(v||'').split(' ');return p[1]?p[1].slice(0,5):v||'--'}
function renderAlerts(alerts,total){
  document.getElementById('alertCount').textContent=(total||0)+' 条未处理';
  var body=document.getElementById('alertsBody');if(!alerts.length){body.innerHTML='<div class="empty">暂无未处理告警</div>';ALERT_PAGES=1;ALERT_PAGE=0;return}
  var per=3;ALERT_PAGES=Math.max(1,Math.ceil(alerts.length/per));ALERT_PAGE=ALERT_PAGE%ALERT_PAGES;var list=alerts.slice(ALERT_PAGE*per,ALERT_PAGE*per+per);
  body.innerHTML='<div class="alert-list">'+list.map(function(a){var color=a.level==='critical'?'#df4b4b':'#dc8b18';return'<div class="alert-item" data-id="'+a.machine_id+'" style="--sev:'+color+'"><div class="alert-top"><span class="alert-name">'+esc(a.machine_name)+'</span><span class="alert-time">'+esc(timeShort(a.created_at))+'</span></div><div class="alert-msg">'+esc(a.message)+'</div><div class="alert-meta">'+esc(a.type||'监控告警')+' · '+(a.level==='critical'?'严重':'警告')+'</div></div>'}).join('')+'</div>'+(ALERT_PAGES>1?'<div class="pager">'+Array.from({length:ALERT_PAGES},function(_,i){return'<i class="'+(i===ALERT_PAGE?'on':'')+'"></i>'}).join('')+'</div>':'');
  Array.prototype.forEach.call(body.querySelectorAll('.alert-item'),function(el){el.onclick=function(){window.open('/monitor/'+el.dataset.id,'_blank')}});
}
function renderCapacity(cap){var items=cap.items||[],summary=cap.summary||{};document.getElementById('capNote').textContent=(summary.attention||items.length||0)+' 台需关注';var body=document.getElementById('capacityBody');if(!items.length){body.innerHTML='<div class="empty">暂无磁盘容量风险</div>';return}body.innerHTML='<div class="cap-list">'+items.slice(0,3).map(function(p){var pct=Number(p.current_disk_pct)||0,days=p.days_until_full==null?'持续观察':'预计 '+p.days_until_full+' 天写满';return'<div class="cap-item" data-id="'+p.machine_id+'"><div class="cap-top"><span class="cap-name">'+esc(p.machine_name)+'</span><span class="cap-days">'+esc(days)+'</span></div><div class="cap-info"><div class="bar" style="--bar-color:'+(pct>=90?'#df4b4b':'#dc8b18')+'"><i style="width:'+Math.min(100,pct)+'%"></i></div><span class="cap-pct">'+num(pct,1)+'%</span></div></div>'}).join('')+'</div>';Array.prototype.forEach.call(body.querySelectorAll('.cap-item'),function(el){el.onclick=function(){window.open('/monitor/'+el.dataset.id,'_blank')}})}
function render(data){DATA=data;renderKpis(data.stats||{});renderResource(data.stats||{});renderTrend(data.trend||{});renderHealth(data.machines||[]);renderAlerts(data.alerts||[],(data.stats||{}).unresolved_alerts||0);renderCapacity(data.capacity||{});document.getElementById('updateText').textContent='更新于 '+(data.generated_at||'--')}
function setState(ok,message){var pill=document.getElementById('livePill');pill.classList.toggle('bad',!ok);document.getElementById('liveText').textContent=message}
function load(){if(LOADING)return;LOADING=true;var ctrl=new AbortController(),timer=setTimeout(function(){ctrl.abort()},25000);fetch(API,{cache:'no-store',signal:ctrl.signal}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(function(res){if(!res||res.code!==0||!res.data)throw new Error('数据格式异常');FAILS=0;LAST_OK=res.data.generated_at||'';render(res.data);setState(true,'全局数据正常')}).catch(function(){FAILS++;setState(false,DATA?'数据已过期 · 保留最后数据':'数据连接失败');if(LAST_OK)document.getElementById('updateText').textContent='最后成功 '+LAST_OK+' · 连续失败 '+FAILS+' 次'}).finally(function(){clearTimeout(timer);LOADING=false})}
document.getElementById('refreshBtn').onclick=load;document.getElementById('fullBtn').onclick=function(){if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()};
document.addEventListener('keydown',function(e){if(e.key==='f'||e.key==='F')document.getElementById('fullBtn').click();if(e.key==='r'||e.key==='R')load()});
document.addEventListener('visibilitychange',function(){if(!document.hidden)load()});window.addEventListener('resize',fit);
var alertsBody=document.getElementById('alertsBody');alertsBody.onmouseenter=function(){alertsBody.dataset.pause='1'};alertsBody.onmouseleave=function(){alertsBody.dataset.pause=''};
fit();clock();renderLegend();setInterval(clock,1000);load();setInterval(load,15000);setInterval(function(){if(!DATA||alertsBody.dataset.pause||document.hidden)return;ALERT_PAGE=(ALERT_PAGE+1)%ALERT_PAGES;renderAlerts(DATA.alerts||[],(DATA.stats||{}).unresolved_alerts||0)},7000);
})();
</script>
