services:
  # ============ MySQL 业务数据库 ============
  mysql:
    image: mysql:8.0
    container_name: monitor-mysql
    mem_limit: 1g
    cpus: "1.5"
    restart: always
    environment:
      # ⚠️ 时区锁定为北京时间，禁止修改！
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置}
      MYSQL_DATABASE: monitor_platform
      MYSQL_USER: monitor
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      - --binlog_expire_logs_seconds=259200
    networks:
      - monitor-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============ InfluxDB 时序数据库 ============
  influxdb:
    image: influxdb:2.7
    container_name: monitor-influxdb
    mem_limit: 1g
    cpus: "1.5"
    restart: always
    environment:
      # ⚠️ 时区锁定为北京时间，禁止修改！
      TZ: Asia/Shanghai
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: monitor
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD:?请在 .env 中设置}
      DOCKER_INFLUXDB_INIT_ORG: monitor-org
      DOCKER_INFLUXDB_INIT_BUCKET: machine_metrics
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN:?请在 .env 中设置}
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    networks:
      - monitor-net
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============ FastAPI 后端服务 ============
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: monitor-backend
    # PERF-20260915b：生产禁用 --reload。
    # ① 镜像里的旧 CMD 带 --reload（开发特性）：/app 是 bind-mount，任何 .py 写入
    #    （包括往 backups-*/ 目录拷 .py 备份、临时诊断脚本）都会触发全站热重启，
    #    实测该窗口 /api/health 要等 14.5s 才返回；reloader 还常驻一个父进程+文件监视。
    # ② ⚠ 必须单进程：本应用 lifespan 里挂着 8 个后台采集循环，且状态全在进程内
    #    （COLLECTOR_STATS / dashboard 缓存 / WebSocket 连接表）。开 --workers 2 会让
    #    每个 worker 各跑一遍采集 → 重复写 InfluxDB、重复告警、WS 连接表分裂
    #    （前端连 A worker、采集器在 B worker 广播 → 推不到）。
    #    因此这里显式不带 --workers，也不要按 Dockerfile 里的 --workers 2 执行。
    # ③ 关掉后改后端代码需显式 `docker restart monitor-backend`（不再自动重启）。
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    mem_limit: 768m
    cpus: "2.0"
    memswap_limit: 768m
    # RESILIENCE-20260915：健康检查。
    # `restart: always` 只能覆盖"进程退出"，对"进程假死（不退出但无响应）"无能为力
    # —— 那类故障靠这个 healthcheck 标记 unhealthy，再由宿主机 monitor-watchdog.timer 自动重启。
    # 容器内无 curl，用自带 python3 探；network_mode: host 故 127.0.0.1:8000 可达。
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=4).getcode()==200 else 1)"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 45s
    env_file:
      - .env
    restart: always
    network_mode: host
    environment:
      # ⚠️ 时区锁定为北京时间，禁止修改！
      TZ: Asia/Shanghai
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_USER: monitor
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置}
      MYSQL_DATABASE: monitor_platform
      INFLUXDB_URL: http://127.0.0.1:8086
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN:?请在 .env 中设置}
      INFLUXDB_ORG: monitor-org
      INFLUXDB_BUCKET: machine_metrics
      AI_API_KEY: ${AI_API_KEY}
      AI_MODEL: ${AI_MODEL:-deepseek-chat}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.deepseek.com/v1}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASS: ${ADMIN_PASS:-admin123}
      SECRET_KEY: ${SECRET_KEY:?请在 .env 中设置}
      JWT_SECRET: ${JWT_SECRET:?请在 .env 中设置}
    volumes:
      - ./backend:/app
    depends_on:
      mysql:
        condition: service_healthy
      influxdb:
        condition: service_healthy

  # ============ Vue3 前端服务 ============
  frontend:
    image: monitor-frontend:optimized
    container_name: monitor-frontend
    mem_limit: 128m
    cpus: "0.5"
    restart: always
    # RESILIENCE-20260915：nginx 假死（进程在但 80 不响应）由 healthcheck 标记，
    # 再交给 monitor-watchdog.timer 自动重启。镜像内有 curl。
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/https.conf:/etc/nginx/conf.d/https.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
    networks:
      - monitor-net

  # ============ 采集 Agent ============
  collector:
    build:
      context: ./collector
      dockerfile: Dockerfile
    container_name: monitor-collector
    mem_limit: 128m
    cpus: "0.5"
    restart: always
    network_mode: host
    pid: host
    privileged: true
    environment:
      BACKEND_URL: http://localhost:8000
      COLLECT_INTERVAL: 10
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    depends_on:
      - backend

volumes:
  mysql_data:
  influxdb_data:
  influxdb_config:

networks:
  monitor-net:
    driver: bridge


