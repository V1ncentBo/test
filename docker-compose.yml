services:
  # ============ MySQL 业务数据库 ============
  mysql:
    image: mysql:8.0
    container_name: monitor-mysql
    mem_limit: 1g
    cpus: "1.5"
    restart: always
    environment:
      # ⚠️ 时区锁定为北京时间，禁止修改！
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置}
      MYSQL_DATABASE: monitor_platform
      MYSQL_USER: monitor
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      - --binlog_expire_logs_seconds=259200
    networks:
      - monitor-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============ InfluxDB 时序数据库 ============
  influxdb:
    image: influxdb:2.7
    container_name: monitor-influxdb
    mem_limit: 1g
    cpus: "1.5"
    restart: always
    environment:
      # ⚠️ 时区锁定为北京时间，禁止修改！
      TZ: Asia/Shanghai
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: monitor
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD:?请在 .env 中设置}
      DOCKER_INFLUXDB_INIT_ORG: monitor-org
      DOCKER_INFLUXDB_INIT_BUCKET: machine_metrics
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN:?请在 .env 中设置}
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    networks:
      - monitor-net
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============ FastAPI 后端服务 ============
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: monitor-backend
    mem_limit: 512m
    cpus: "1.0"
    memswap_limit: 512m
    env_file:
      - .env
    restart: always
    ports:
      - "8000:8000"
    environment:
      # ⚠️ 时区锁定为北京时间，禁止修改！
      TZ: Asia/Shanghai
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: monitor
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置}
      MYSQL_DATABASE: monitor_platform
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN:?请在 .env 中设置}
      INFLUXDB_ORG: monitor-org
      INFLUXDB_BUCKET: machine_metrics
      AI_API_KEY: ${AI_API_KEY}
      AI_MODEL: ${AI_MODEL:-deepseek-chat}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.deepseek.com/v1}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASS: ${ADMIN_PASS:-admin123}
      SECRET_KEY: ${SECRET_KEY:?请在 .env 中设置}
      JWT_SECRET: ${JWT_SECRET:?请在 .env 中设置}
    # ⛔ COMMAND-FIX-20260923：显式固定启动命令，消除「三处不一致」。
    # Dockerfile CMD 写的是 --workers 2（明令禁止双 worker），运行中容器是 --reload（开发标志），
    # 而 backend 段原本【没有 command:】⇒ 任何 `up -d --force-recreate backend` 都会
    # 静默切到 2 worker ⇒ 两份 db_collector() 各自 30s 全自动重采，数据互相覆盖、状态互相打架。
    # 另：去掉 --reload 后，改后端代码需 `docker restart monitor-backend` 才生效（不再自动重载）。
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - ./backend:/app
      # FILELIB-20260918：运维文件库。文件落独立 200G 盘 /opt/monitor-platform/filelib
      # （ext4, UUID=aacec267-5b57-4817-819a-204033f950d6，已写 fstab）。
      # ⚠ 独立挂载卷，不参与 docker commit —— 否则几十 G 镜像会被烤进镜像层。
      - ./filelib:/app/filelib
    depends_on:
      mysql:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    networks:
      - monitor-net
    # RESILIENCE：健康检查。注意镜像内**无 curl**，只能用自带 python3 探活。
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ============ Vue3 前端服务 ============
  frontend:
    # ⛔ COMPOSE-SYNC-20260918：必须指向 :optimized（当前 = optimized-fileshelf-20260918）。
    # 此前写 monitor-platform-frontend:latest（旧镜像），一旦 compose 重建前端就会
    # 把全部热修（mc-custom.{js,css} / filelib.html 等注入页）抹掉！这是本项目最贵的坑。
    # 热修后的固化流程见 SKILL monitor-frontend-ops：docker commit → tag :optimized。
    image: monitor-frontend:optimized
    container_name: monitor-frontend
    mem_limit: 128m
    cpus: "0.5"
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - monitor-net
    # RESILIENCE：nginx 镜像自带 curl 探首页。
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ============ 采集 Agent ============
  collector:
    build:
      context: ./collector
      dockerfile: Dockerfile
    container_name: monitor-collector
    mem_limit: 128m
    cpus: "0.5"
    restart: always
    network_mode: host
    pid: host
    privileged: true
    environment:
      BACKEND_URL: http://localhost:8000
      COLLECT_INTERVAL: 10
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    depends_on:
      - backend

volumes:
  mysql_data:
  influxdb_data:
  influxdb_config:

networks:
  monitor-net:
    # COMPOSE-SYNC-20260918：显式锁定网络真名。
    # 此前只写 driver，实际名称由 compose 用「目录名_网络名」展开成
    # monitor-platform_monitor-net —— 一旦目录改名/换项目名，网络就会漂移。
    # 这里显式声明，与线上 docker network ls 实际一致。
    name: monitor-platform_monitor-net
    driver: bridge


